name: build

on:
    workflow_dispatch:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    linux:
        strategy:
            matrix:
                os:
                - [swift-stable, ubuntu-latest, X64, self-hosted]
                - [swift-stable, ubuntu-latest, ARM64, self-hosted]

        runs-on: ${{ matrix.os }}
        name: Linux (${{ matrix.os[2] }})
        steps:
            -   name: 🝮 Checkout 🝮
                uses: actions/checkout@v3

            -   name: 🝮 Swift version 🝮
                run: swift --version

            -   name: 🝮 Build XCF 🝮
                run: Scripts/Build/Linux

    macos:
        runs-on: [self-hosted, macos-26]
        name: macOS
        steps:
            -   name: 🝮 Wipe gitconfig 🝮
                run: echo "" > ~/.gitconfig

            -   name: 🝮 Checkout 🝮
                uses: actions/checkout@v4

            -   name: 🝮 Git credential setup 🝮
                uses: ./.github/actions/credentials-setup
                with:
                    token: ${{ secrets.CI_MACHINE_PAT }}
                    ordo-auth-token: ${{ secrets.ORDO_AUTH_TOKEN }}

            -   name: 🝮 Swift version 🝮
                run: swift --version

            -   name: 🝮 Brew install xcodegen 🝮
                run: brew install xcodegen

            -   name: 🝮 Build XCF 🝮
                run: Scripts/Build/macOS
