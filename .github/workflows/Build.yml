name: build

on:
    workflow_dispatch:
    pull_request:
        branches: [ main ]
    push:
        branches: [ main ]
        tags:
            -   '[0-9]+.[0-9]+.[0-9]+'

jobs:
    macos:
        runs-on: [self-hosted, macos-26]
        name: macOS
        steps:
            -   name: 🝮 Wipe gitconfig 🝮
                run: echo "" > ~/.gitconfig

            -   name: 🝮 Checkout 🝮
                uses: actions/checkout@v4

            -   name: 🝮 Git credential setup 🝮
                uses: ./.github/actions/credentials-setup
                with:
                    token: ${{ secrets.CI_MACHINE_PAT }}
                    ordo-auth-token: ${{ secrets.ORDO_AUTH_TOKEN }}

            -   name: 🝮 Swift version 🝮
                run: swift --version

            -   name: 🝮 Build 🝮
                run: Scripts/Build/macOS

            -   name: 🝮 Upload 🝮
                uses: actions/upload-artifact@v6
                with:
                    name: xcframework-macos
                    path: '*.xcframework.zip'
                    compression-level: 0
                    retention-days: 1
                    overwrite: true

    linux:
        strategy:
            matrix:
                os:
                - [swift-stable, ubuntu-latest, X64, self-hosted]
                - [swift-stable, ubuntu-latest, ARM64, self-hosted]

        runs-on: ${{ matrix.os }}
        name: Linux (${{ matrix.os[2] }})
        steps:
            -   name: 🝮 Checkout 🝮
                uses: actions/checkout@v3

            -   name: 🝮 Swift version 🝮
                run: swift --version

            -   name: 🝮 Build 🝮
                run: Scripts/Build/Linux

            -   name: 🝮 Upload 🝮
                uses: actions/upload-artifact@v6
                with:
                    name: xcframework-linux-${{ matrix.os[2] }}
                    path: '*.xcframework.zip'
                    # xcframeworks is already compressed, so don’t bother compressing it again
                    compression-level: 0
                    retention-days: 1
                    overwrite: true

    linux-merge:
        runs-on: [swift-stable, ubuntu-latest, X64, self-hosted]
        needs: [linux]
        name: Linux
        steps:
            -   name: 🝮 Download XCFs 🝮
                uses: actions/download-artifact@v7
                with:
                    path: downloads
                    pattern: xcframework-linux-*

            # all plists are identical, so we can just take the first one for the merged XCF
            -   name: 🝮 Merge XCFs 🝮
                run: |
                    mkdir -p constituents
                    for file in downloads/*/*.zip; do
                        unzip -o "$file" -d constituents/
                    done

                    cd constituents

                    for framework in *.xcframework; do
                        zip -r "${framework}.zip" "${framework}"
                    done

            -   name: 🝮 Upload 🝮
                uses: actions/upload-artifact@v6
                with:
                    name: xcframework-linux
                    path: constituents/*.xcframework.zip
                    compression-level: 0
                    retention-days: 1
                    overwrite: true

    release:
        runs-on: ubuntu-latest
        needs: [macos, linux-merge]
        name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        steps:
            -   name: 🝮 Download macOS XCF 🝮
                uses: actions/download-artifact@v7
                with:
                    name: xcframework-macos
                    path: release-artifacts

            -   name: 🝮 Download Linux XCF 🝮
                uses: actions/download-artifact@v7
                with:
                    name: xcframework-linux
                    path: release-artifacts

            -   name: 🝮 Create GitHub release 🝮
                uses: softprops/action-gh-release@v2
                with:
                    repository: 'ordo-one/distributed-system-sdk'
                    token: ${{ secrets.CI_MACHINE_PAT }}
                    files: release-artifacts/*.zip
                    generate_release_notes: true

            -   name: 🝮 Checkout downstream 🝮
                uses: actions/checkout@v4
                with:
                    repository: 'ordo-one/distributed-system-sdk'
                    token: ${{ secrets.CI_MACHINE_PAT }}
                    path: downstream

            -   name: 🝮 Generate Package.swift 🝮
                run: |
                    TAG="${{ github.ref_name }}"
                    CHECKSUM_MACOS=$(swift package compute-checksum release-artifacts/*-macOS.xcframework.zip)
                    CHECKSUM_LINUX=$(swift package compute-checksum release-artifacts/*-Linux.xcframework.zip)

                    echo "macOS Checksum: ${CHECKSUM_MACOS}"
                    echo "Linux Checksum: ${CHECKSUM_LINUX}"

                    cd downstream

                    sed -e "s/__TAG__/${TAG}/g" \
                        -e "s/__CHECKSUM_MACOS__/${CHECKSUM_MACOS}/g" \
                        -e "s/__CHECKSUM_LINUX__/${CHECKSUM_LINUX}/g" \
                        Package.template.swift > Package.swift

                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"

                    git add Package.swift
                    git commit -m "Release ${TAG}"
                    git tag "${TAG}"
                    git push origin main
                    git push origin refs/tags/${TAG}
