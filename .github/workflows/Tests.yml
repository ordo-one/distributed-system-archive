name: tests

on:
    workflow_dispatch:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    linux:
        runs-on: [swift-stable, ubuntu-latest, X64, self-hosted]
        name: Linux
        steps:
            -   name: 🝮 Checkout 🝮
                uses: actions/checkout@v3

            -   name: 🝮 Swift Version 🝮
                run: swift --version

            -   name: 🝮 Build XCF 🝮
                run: Scripts/Build/Linux

    macos:
        runs-on: [self-hosted, macos-26]
        name: macOS
        steps:
            -   name: 🝮 Checkout 🝮
                uses: actions/checkout@v3

            -   name: 🝮 Swift Version 🝮
                run: swift --version

            -   name: 🝮 Select Xcode 🝮
                run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

            -   name: 🝮 Build XCF 🝮
                run: Scripts/Build/macOS
