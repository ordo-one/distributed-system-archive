name: OrdoDistributedABI
options:
    bundleIdPrefix: com.ordo-one
    createSharedSchemes: true
targets:
    DistributedABI:
        type: framework
        platform: [macOS, iOS]
        deploymentTarget:
            macOS: "26.0"
            iOS: "26.0"
        sources:
            - path: Sources/DistributedABI
        settings:
            base:
                BUILD_LIBRARY_FOR_DISTRIBUTION: YES
                GENERATE_INFOPLIST_FILE: YES
                OTHER_SWIFT_FLAGS: "$(inherited) -enable-experimental-feature Lifetimes"
                SKIP_INSTALL: NO
                SWIFT_STRICT_MEMORY_SAFETY: YES
